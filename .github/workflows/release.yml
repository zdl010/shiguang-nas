name: release

# jpackage 不能交叉编译：每个平台的包必须在对应平台上构建。
# 这就是这里必须用 matrix 而不是一个 job 的原因。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先跑一遍测试。四个平台的打包加起来要十几分钟，
  # 让一个明显的失败在两分钟内就暴露出来。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端构建
        working-directory: frontend
        run: npm ci && npm run build

      - name: 后端测试
        run: mvn -B verify

      # 依赖漏洞扫描。用 NVD 数据源，需要一个免费 API key 才不会被限流；
      # 没配 secret 时跳过，不因此挡住发版。
      - name: 依赖漏洞扫描
        if: env.NVD_API_KEY != ''
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -Psecurity-scan verify -DnvdApiKey="$NVD_API_KEY"

  package:
    needs: test
    strategy:
      # 一个平台失败不该让其他三个的产物也拿不到
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest        # Apple Silicon
            target: darwin-arm64
          - os: macos-13            # Intel
            target: darwin-x86_64
          - os: windows-latest
            target: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 打包（Unix）
        if: runner.os != 'Windows'
        run: ./packaging/jpackage.sh

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/jpackage.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ShiguangNAS-${{ matrix.target }}
          # zip 和 tar.gz 各平台只会命中一个，用通配避免写 if
          path: |
            packaging/build/*.zip
            packaging/build/*.tar.gz
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          body: |
            解压后双击启动器即可，不需要预装 Java。

            **首次启动**
            - Windows 会弹防火墙提示，必须勾选「专用网络」，否则手机访问不到
            - 浏览器会自动打开；第一个注册的账号就是管理员
            - 在共享网络（宿舍 / 办公室）里，建议先建好管理员再接入局域网

            **已知限制**
            - macOS 包未签名公证，首次打开需右键 → 打开
            - Windows 包未签名，会触发 SmartScreen，需点「更多信息 → 仍要运行」
