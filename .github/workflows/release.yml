name: release

# jpackage 不能交叉编译：每个平台的包必须在对应平台上构建。
# 这就是这里必须用 matrix 而不是一个 job 的原因。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先跑一遍测试。四个平台的打包加起来要十几分钟，
  # 让一个明显的失败在两分钟内就暴露出来。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ffmpeg 可执行文件链接了 libavdevice / libavutil，它们需要 ALSA、
      # PulseAudio、xcb、VA-API 这些系统库。装的是 x86_64 和 arm64 两个包
      # 各自缺失项的并集——arm64 的 jar 捆了 libasound 却没捆 libva/libdrm，
      # x86_64 恰好相反，只按一个平台配会在另一个上翻车。
      - name: Linux 运行时依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libasound2t64 libpulse0 libxcb1 libxcb-shm0 libva2 libva-drm2 libdrm2

      - name: 前端构建
        working-directory: frontend
        run: npm ci && npm run build

      - name: 后端测试
        run: mvn -B verify

      # 依赖漏洞扫描。用 NVD 数据源，需要一个免费 API key 才不会被限流；
      # 没配 secret 时跳过，不因此挡住发版。
      - name: 依赖漏洞扫描
        if: env.NVD_API_KEY != ''
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -Psecurity-scan verify -DnvdApiKey="$NVD_API_KEY"

  package:
    needs: test
    strategy:
      # 一个平台失败不该让其他三个的产物也拿不到
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest       # x86_64
            target: linux-x86_64
          # ubuntu-24.04-arm 已经正式可用（非 preview）。pom 里
          # platform-linux-arm64 这个 profile 一直没有 job 会触发它。
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest        # Apple Silicon
            target: darwin-arm64
          # 不能写 macos-13：那个镜像已经从 GitHub 托管 runner 里退役了。
          # 它失败时 fail-fast: false 会让另外几个包照常产出，
          # 于是发出去的 Release 会静悄悄少一个 Intel Mac 包。
          - os: macos-15-intel
            target: darwin-x86_64
          - os: windows-latest
            target: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ffmpeg 可执行文件链接了 libavdevice / libavutil，它们需要 ALSA、
      # PulseAudio、xcb、VA-API 这些系统库。装的是 x86_64 和 arm64 两个包
      # 各自缺失项的并集——arm64 的 jar 捆了 libasound 却没捆 libva/libdrm，
      # x86_64 恰好相反，只按一个平台配会在另一个上翻车。
      - name: Linux 运行时依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libasound2t64 libpulse0 libxcb1 libxcb-shm0 libva2 libva-drm2 libdrm2

      # 单独跑一次，让每个平台的测试结果在日志里看得见。
      # 打包脚本用的是 mvn -q，测试通过时摘要会被压掉，只有失败才出声——
      # 对发布流水线来说"没报错"不算证据，得能指着日志说这个平台跑了多少条。
      - name: 测试（本平台）
        run: mvn -B test

      - name: 打包（Unix）
        if: runner.os != 'Windows'
        env:
          SKIP_TESTS: '1'
        run: ./packaging/jpackage.sh

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SKIP_TESTS: '1'
        run: ./packaging/jpackage.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ShiguangNAS-${{ matrix.target }}
          # zip 和 tar.gz 各平台只会命中一个，用通配避免写 if
          path: |
            packaging/build/*.zip
            packaging/build/*.tar.gz
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          body: |
            解压后双击启动器即可，不需要预装 Java。

            | 平台 | 下载 |
            |---|---|
            | Windows (x64) | `windows-x86_64.zip` |
            | macOS (Apple Silicon) | `darwin-arm64.zip` |
            | macOS (Intel) | `darwin-x86_64.zip` |
            | Linux (x64) | `linux-x86_64.tar.gz` |
            | Linux (ARM64) | `linux-arm64.tar.gz` |

            **首次启动**
            - 浏览器会自动打开，用 `admin` / `admin` 登录，系统会强制你立刻改一个复杂密码
            - 初始密码是公开的，所以请**先启动、先改密码、再接入局域网**。
              在改掉之前，服务端会拒绝除「改密码」以外的所有接口，闯进来的人翻不了照片
            - 控制台会打印局域网地址（形如 `http://192.168.1.10:18888`），手机浏览器打开它，
              也可以在「我的」页面扫二维码
            - Windows 会弹防火墙提示，**必须勾选「专用网络」**，否则手机一定连不上

            **未签名分发**
            - macOS：提示"无法验证开发者"，右键点 `.app` → 打开 → 再点打开
            - Windows：SmartScreen 拦截，点「更多信息」→「仍要运行」
